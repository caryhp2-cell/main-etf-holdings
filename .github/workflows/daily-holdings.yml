name: Daily ETF holdings

on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scrape Goal Star holdings
        run: npm run scrape:today

      - name: Rebuild manifest
        run: npm run manifest

      - name: Commit changed holdings data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/holdings data/manifest.json
          if git diff --cached --quiet; then
            echo "No holdings changes to commit."
          else
            git commit -m "data: update daily ETF holdings"
            git push
          fi
