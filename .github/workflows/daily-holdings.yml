name: Daily ETF holdings

on:
  schedule:
    # 18:30 and 21:30 Asia/Taipei, Monday-Friday.
    - cron: "30 10,13 * * 1-5"
    # 00:30, 03:30, and 06:30 Asia/Taipei, Tuesday-Saturday.
    # These retry the previous Taiwan trading date, so filenames keep the market date.
    - cron: "30 16,19,22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scrape Goal Star holdings
        run: npm run scrape:retry

      - name: Rebuild manifest
        run: npm run manifest

      - name: Commit changed holdings data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/holdings data/manifest.json
          if git diff --cached --quiet; then
            echo "No holdings changes to commit."
          else
            git commit -m "data: update daily ETF holdings"
            git push
          fi
